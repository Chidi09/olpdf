[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olpdf"
version = "0.1.0"
description = "Python client for the OLPDF PDF editing API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "OLPDF", email = "hello@olpdf.xyz" }]
keywords = ["pdf", "editor", "ai", "olpdf"]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://olpdf.xyz"
Repository = "https://github.com/Chidi09/olpdf"
Documentation = "https://olpdf.xyz/docs"

[tool.hatch.build.targets.wheel]
packages = ["olpdf"]
