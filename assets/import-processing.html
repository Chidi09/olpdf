<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OLPDF Import Progress</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,700;1,6..72,400&amp;family=Manrope:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "status-review": "#e8834a",
                    "on-secondary-fixed": "#002116",
                    "inverse-primary": "#835500",
                    "primary-fixed-dim": "#fdba5a",
                    "on-primary-fixed": "#291800",
                    "tertiary-fixed-dim": "#ffb4a9",
                    "on-tertiary": "#690002",
                    "tertiary-fixed": "#ffdad5",
                    "on-background": "#e5e1e6",
                    "status-error": "#e85a4a",
                    "border-strong": "rgba(255, 255, 255, 0.12)",
                    "on-primary-fixed-variant": "#633f00",
                    "text-primary": "#f0ede8",
                    "outline": "#9d8e7d",
                    "background": "#131316",
                    "surface": "#131316",
                    "outline-variant": "#514537",
                    "on-error": "#690005",
                    "on-primary": "#452b00",
                    "surface-dim": "#131316",
                    "on-tertiary-fixed": "#410001",
                    "on-surface-variant": "#d5c4b1",
                    "surface-container-highest": "#353438",
                    "surface-bright": "#39393c",
                    "on-secondary": "#003828",
                    "secondary-fixed": "#93f6ce",
                    "accent-gold": "#e8a84a",
                    "text-tertiary": "#4a4850",
                    "surface-container": "#1f1f22",
                    "primary": "#ffc677",
                    "bg-elevated": "#1c1c22",
                    "surface-container-low": "#1b1b1e",
                    "on-surface": "#e5e1e6",
                    "on-primary-container": "#623f00",
                    "on-error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#8c1710",
                    "inverse-surface": "#e5e1e6",
                    "error": "#ffb4ab",
                    "on-secondary-fixed-variant": "#00513b",
                    "bg-base": "#0c0c0f",
                    "secondary-fixed-dim": "#76d9b2",
                    "primary-container": "#e8a84a",
                    "surface-variant": "#353438",
                    "secondary-container": "#017f5e",
                    "text-secondary": "#8a8790",
                    "surface-container-high": "#2a2a2d",
                    "inverse-on-surface": "#303033",
                    "error-container": "#93000a",
                    "surface-tint": "#fdba5a",
                    "tertiary-container": "#ff988a",
                    "on-tertiary-container": "#8b160f",
                    "on-secondary-container": "#cfffe8",
                    "tertiary": "#ffc1b8",
                    "primary-fixed": "#ffddb4",
                    "border-subtle": "rgba(255, 255, 255, 0.06)",
                    "surface-container-lowest": "#0e0e11",
                    "secondary": "#76d9b2",
                    "status-ok": "#4aae8a",
                    "bg-glass": "rgba(28, 28, 34, 0.72)",
                    "bg-surface": "#141418"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "lg": "24px",
                    "xl": "40px",
                    "md": "16px",
                    "unit": "4px",
                    "sm": "8px",
                    "canvas-max-width": "800px",
                    "sidebar-width": "200px",
                    "2xl": "64px"
            },
            "fontFamily": {
                    "h2": ["Manrope"],
                    "display-lg": ["Newsreader"],
                    "body-ui": ["Manrope"],
                    "h1": ["Manrope"],
                    "doc-body": ["Newsreader"],
                    "display-md": ["Newsreader"],
                    "mono-technical": ["Space Grotesk"],
                    "doc-heading": ["Newsreader"]
            },
            "fontSize": {
                    "h2": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                    "display-lg": ["56px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "body-ui": ["14px", { "lineHeight": "1.6", "fontWeight": "400" }],
                    "h1": ["28px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                    "doc-body": ["11pt", { "lineHeight": "1.6", "fontWeight": "400" }],
                    "display-md": ["40px", { "lineHeight": "1.15", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "mono-technical": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                    "doc-heading": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }]
            }
          }
        }
      }
    </script>
<style>
        /* Utility class to enforce material symbols */
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-bg-base text-text-primary min-h-screen overflow-hidden font-body-ui text-body-ui relative">
<!-- Simulated Editor Background -->
<div class="absolute inset-0 flex p-8 gap-8 pointer-events-none opacity-40">
<!-- Sidebar placeholder -->
<div class="w-sidebar-width bg-bg-surface border-r border-border-subtle h-full flex flex-col gap-4 p-4 rounded-lg">
<div class="h-8 bg-surface-container-highest rounded w-3/4"></div>
<div class="h-4 bg-surface-container rounded w-full mt-4"></div>
<div class="h-4 bg-surface-container rounded w-5/6"></div>
<div class="h-4 bg-surface-container rounded w-full"></div>
</div>
<!-- Canvas placeholder -->
<div class="flex-1 max-w-canvas-max-width mx-auto bg-bg-surface h-full shadow-[0_16px_48px_rgba(0,0,0,0.6)] rounded-xl border border-border-subtle p-12">
<div class="h-12 bg-surface-container-highest rounded w-1/2 mb-8"></div>
<div class="h-4 bg-surface-container rounded w-full mb-4"></div>
<div class="h-4 bg-surface-container rounded w-[90%] mb-4"></div>
<div class="h-4 bg-surface-container rounded w-[95%] mb-4"></div>
<div class="h-4 bg-surface-container rounded w-full mb-4"></div>
</div>
</div>
<!-- Import Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-bg-base/60 backdrop-blur-[20px]">
<!-- Modal Container -->
<div class="w-full max-w-lg bg-bg-elevated border border-border-strong rounded-xl shadow-[0_32px_64px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col relative">
<!-- Shimmer Top Border Accent -->
<div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-accent-gold to-transparent opacity-60"></div>
<!-- Header -->
<div class="p-lg pb-md flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container border border-border-strong flex items-center justify-center text-accent-gold shadow-[0_0_16px_rgba(232,168,74,0.15)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
</div>
<div>
<h2 class="font-h2 text-h2 text-text-primary">Processing your document</h2>
<p class="font-body-ui text-body-ui text-text-secondary mt-1">Vision Router active</p>
</div>
</div>
<!-- Progress Section -->
<div class="px-lg pb-lg flex flex-col gap-sm">
<div class="flex justify-between items-end mb-1">
<span class="font-body-ui text-body-ui text-text-secondary">Analyzing layout and extracting text...</span>
<span class="font-mono-technical text-mono-technical text-accent-gold font-medium tracking-wide">58%</span>
</div>
<!-- Progress Track -->
<div class="h-[6px] w-full bg-surface-container-highest rounded-full overflow-hidden border border-border-subtle relative">
<!-- Progress Fill -->
<div class="h-full bg-accent-gold rounded-full w-[58%] relative shadow-[0_0_12px_rgba(232,168,74,0.6)]">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
</div>
</div>
</div>
<!-- Vision Router Breakdown (Bento Style) -->
<div class="px-lg py-md bg-surface border-y border-border-subtle flex flex-col gap-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-text-tertiary text-sm">hub</span>
<span class="font-mono-technical text-mono-technical text-text-secondary uppercase tracking-widest">Vision Router Strategy</span>
</div>
<div class="flex flex-col gap-2">
<!-- Complete Item -->
<div class="flex items-center justify-between p-3 rounded-lg bg-bg-elevated border border-border-subtle relative overflow-hidden group">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-status-ok opacity-80"></div>
<div class="flex items-center gap-3 pl-2">
<span class="material-symbols-outlined text-status-ok text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-ui text-body-ui text-text-primary">5 pages complete</span>
</div>
<div class="px-2 py-1 rounded bg-status-ok/10 border border-status-ok/20">
<span class="font-mono-technical text-mono-technical text-status-ok">DONE</span>
</div>
</div>
<!-- OCR Needed Item -->
<div class="flex items-center justify-between p-3 rounded-lg bg-bg-elevated border border-border-subtle relative overflow-hidden group">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-status-review opacity-80"></div>
<div class="flex items-center gap-3 pl-2">
<span class="material-symbols-outlined text-status-review text-[20px]">pageview</span>
<span class="font-body-ui text-body-ui text-text-primary">3 pages need OCR</span>
</div>
<div class="px-2 py-1 rounded bg-status-review/10 border border-status-review/20 flex items-center gap-1.5">
<span class="material-symbols-outlined text-status-review text-[14px]">memory</span>
<span class="font-mono-technical text-mono-technical text-status-review">QUEUED</span>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-4 px-lg flex justify-end bg-bg-elevated">
<button class="px-6 py-2 rounded-DEFAULT font-body-ui text-body-ui text-text-secondary hover:text-text-primary hover:bg-surface-container transition-colors border border-transparent hover:border-border-subtle">
                    Cancel
                </button>
</div>
</div>
</div>
</body></html>
