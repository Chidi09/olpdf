[package]
name = "pdf-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen       = "0.2"
serde              = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
lopdf              = "0"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
