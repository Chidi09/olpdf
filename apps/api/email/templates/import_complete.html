{% extends "base.html" %}

{% block content %}
<h2 style="font-size:22px;color:#0e0e11;margin:0 0 12px;">Your document is ready ✓</h2>
<p style="color:#595661;line-height:1.6;margin:0 0 28px;">
    <strong>{{ doc_title }}</strong> has been processed and is now ready to edit in OLPDF.
</p>
<a href="{{ app_url }}/editor/{{ doc_id }}" style="display:inline-block;background:#e6a449;color:#101014;padding:13px 32px;border-radius:100px;text-decoration:none;font-weight:700;font-size:14px;letter-spacing:0.04em;">Open Document →</a>
<p style="font-size:12px;color:#918d93;margin:28px 0 0;">
    Import complete. All pages have been classified and extracted.
</p>
{% endblock %}
