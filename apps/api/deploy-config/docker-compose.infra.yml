services:
  nginx:
    image: nginx:1.27-alpine
    container_name: olpdf-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - olpdf-shared

  certbot:
    image: certbot/certbot
    container_name: olpdf-certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"

  export:
    image: olpdf/export:latest
    container_name: olpdf-export
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
    networks:
      - olpdf-shared

  ocr-worker:
    image: olpdf/ocr-worker:latest
    container_name: olpdf-ocr-worker
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "8011:8001"
    environment:
      SUPABASE_STORAGE_BUCKET: "${SUPABASE_STORAGE_BUCKET:-user-uploads}"
      OLPDF_API_BASE_URL: "http://olpdf-api-blue:8000"
      OLPDF_DEV_MODE: "${OLPDF_DEV_MODE:-false}"
    networks:
      - olpdf-shared

networks:
  olpdf-shared:
    name: olpdf-shared
